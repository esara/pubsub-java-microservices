# Application
spring.application.name=pubsub-order-processing

# Server
server.port=8080

# Pub/Sub Configuration
pubsub.project-id=${PUBSUB_PROJECT_ID:playground-377422}
pubsub.subscription-name=${PUBSUB_SUBSCRIPTION_NAME:order-processing-subscription}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Logging
logging.level.com.pubsubandchill.pubsub=INFO
logging.level.com.google.cloud.pubsub=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n


{{- if .Values.orderProcessing.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: order-processing
  labels:
    {{- if .Values.labels }}
    {{- toYaml .Values.labels | nindent 4 }}
    {{- end }}
    app.kubernetes.io/component: order-processing
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
  selector:
    {{- if .Values.selectorLabels }}
    {{- toYaml .Values.selectorLabels | nindent 4 }}
    {{- end }}
    app.kubernetes.io/component: order-processing
{{- end }}


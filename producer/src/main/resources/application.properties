# Application
spring.application.name=pubsub-producer

# Server
server.port=8080

# Pub/Sub Configuration
pubsub.project-id=${PUBSUB_PROJECT_ID:playground-377422}
pubsub.topic-name=${PUBSUB_TOPIC_NAME:orders-topic}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.com.pubsubandchill.pubsub=INFO
logging.level.com.google.cloud.pubsub=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

